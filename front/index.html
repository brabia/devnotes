<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Car Rental</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}
    header{padding:40px 8%;background:#111827;color:white}
    main{padding:40px 8%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
    .card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #0001}
    .card img{width:100%;height:190px;object-fit:cover}
    .content{padding:20px}.content h2{margin-top:0}.content strong{font-size:20px}
  </style>
</head>
<body>
<header><h1>Car Rental</h1><p>Available cars</p></header>
<main id="cars" class="grid"><p>Loading...</p></main>
<script>
(async () => {
  const el = document.getElementById('cars');
  try {
    const cars = await fetch('/api/cars.php').then(r => r.json());
    el.innerHTML = cars.map(c => `
      <article class="card">
        <img src="${c.image_url}" alt="${c.brand} ${c.model}">
        <div class="content">
          <h2>${c.brand} ${c.model}</h2>
          <p>${c.year} · ${c.available ? 'Available' : 'Unavailable'}</p>
          <strong>€${Number(c.price_per_day).toFixed(2)} / day</strong>
        </div>
      </article>`).join('');
  } catch { el.innerHTML = '<p>Unable to load cars.</p>'; }
})();
</script>
</body>
</html>
