server {
    listen 80;
    server_name localhost;

    root /var/www/car-rental/front;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        alias /var/www/car-rental/backend/;
        location ~ ^/api/(.+\.php)$ {
            alias /var/www/car-rental/backend/$1;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/car-rental/backend/$1;
            fastcgi_param SCRIPT_NAME /api/$1;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }
}
